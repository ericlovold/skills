[project]
name = "comcast-leads"
version = "0.1.0"
description = "Find new and relocating businesses in the Comcast Business footprint for referral submission."
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
